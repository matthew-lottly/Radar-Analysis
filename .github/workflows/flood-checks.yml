name: Flood project checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r projects/01-flood-mapping/requirements.txt
      - run: python -m unittest discover -s projects/01-flood-mapping/tests -v
